let AC=null;
function audioInit(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tone(f,d,type,v,f2){if(!AC)return;const o=AC.createOscillator(),ga=AC.createGain(),t=AC.currentTime;
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
  ga.gain.setValueAtTime(v||0.08,t);ga.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(ga);ga.connect(AC.destination);o.start(t);o.stop(t+d);}
function noise(d,v){if(!AC)return;const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),da=b.getChannelData(0);
  for(let i=0;i<n;i++)da[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),ga=AC.createGain();s.buffer=b;ga.gain.value=v||0.15;s.connect(ga);ga.connect(AC.destination);s.start();}

function updSensors(dt){

  }

  const sec=WORLD.visit(),ok=sec||OPEN_RECTS.some(r=>px>=r[0]&&px<=r[0]+r[2]&&fy>=r[1]&&fy<=r[1]+r[3]);

/* ============ 攻击模组 ============ */
function outDmg(b,sm){return b*sm*(1+0.04*stk('boom'))*(eq('can')?1.1:1)*(1+0.06*gearN('atk'));}
function boxFor(dir,rw,rh){const cx=P.x+P.w/2,cy=P.y+P.h/2;
  if(dir==='down')return{x:cx-rw/2,y:P.y+P.h-10,w:rw,h:rh};
  if(dir==='up')return{x:cx-rw/2,y:P.y+10-rh,w:rw,h:rh};
  return{x:P.face>0?cx:cx-rw,y:cy-rh/2,w:rw,h:rh};}
function fireWave(dmg){projs.push({k:'wave',x:P.x+17+P.face*20,y:P.y+30,vx:P.face*620,vy:0,r:22,dmg,friendly:1,life:0.5,pierce:1,hit:new Set(),ghost:1,burn:1,grav:0});}
const WIND=0.06; // 按键到判定的延迟（原来迷迷要等 0.33 秒，手感发粘）
const momentumMul=()=>1-0.07*(G.mom||0);
function attack(c,dir){
  if(AIR_COMBAT.attackMode(c.id,dir,P.onGround)==='plunge'){startPlunge(c);return;}
  const mo=momentumMul();
  if(c.id==='mimi'){
    if(P.pendingStrike)return;
    // 三段连招：轻 → 轻 → 重砸（0.8 秒内接续）；空中上/下劈不进连招
    const step=dir==='fwd'?(G.t-(P.cmbAt||-9)<0.8?(P.cmbM||0)%3+1:1):0;P.cmbM=step;P.cmbAt=G.t;
    const clip=ART.clip('mimi_attack'),imp=clip.events.find(e=>e.name==='impact');
    P.artAttackAt=G.t-imp.frame/clip.fps+WIND;   // 动画直接从挥下的那一帧开始播
    P.atkCd=[.45,.24,.27,.52][step]*mo;P.atkAnim=0.3;P.atkDir=dir;
    P.pendingStrike={c:{...c},dir,t:WIND,step};
    if(step&&P.onGround){P.lunge=0.07;P.vx=P.face*(step===3?380:240);}
  }else{
    const clip=ART.clip((CH[c.id].anim||'')+'_attack'),imp=clip&&clip.events.find(e=>e.name==='impact');
    if(G.t-P.artAttackAt>.22)P.artAttackAt=G.t-(imp?imp.frame/clip.fps:0)+0.03;
    performAttack(c,dir);P.atkCd*=mo;
  }
}

  const hot=P.buff&&P.buff.type==='hot';
  if(id==='mimi'&&step){dm*=[1,.65,.75,1.5][step];if(step<3){o.heavy=0;o.kb=140;o.explosive=0;}else o.kb=380;}
  if(P.buff&&P.buff.type==='blood'){cd/=1.8;dm*=1.6;}

  P.atkCd=queued?Math.max(P.atkCd,.06):cd;P.atkAnim=queued?Math.max(P.atkAnim,.16):0.16;P.atkDir=dir;let n=0;

    let [rw,rh]=dir==='fwd'?a.fw:a.vt;if(dir==='fwd')rw*=rg;else rh*=rg;

      if(dir==='fwd'&&step!==1&&step!==2){const gy=P.y+P.h;n+=explode(cx+P.face*90*rg,gy-20,58*rg*(1+0.03*stk('boom')),dm*0.4,true,{heavy:0,kb:120});

      else sfx('heavy');
    }else if(id==='lala'){
      for(let i=0;i<3;i++){const s=rnd(300,640);let vx=0,vy=0;if(dir==='fwd')vx=P.face*s;else vy=dir==='down'?s:-s;
        fx.push({k:'flame',x:cx+(dir==='fwd'?P.face*24:0),y:cy+(dir==='fwd'?4:0),vx:vx+rnd(-50,50),vy:vy+rnd(-50,50),life:(dir==='fwd'?rw:rh)/640,max:0.4,size:rnd(8,18)});}

    }else if(id==='bobo'){explode(cx,P.y+P.h+40,60,0,true);}
    else{

      if(n===0)tone(id==='tiefu'?140:500,0.06,'triangle',0.03,id==='tiefu'?90:300);
    }
  }
  if(n>0&&dir==='fwd'&&id!=='lala')P.rx=-P.face*(o.heavy?200:110); // 命中后坐力

function fixRoster(keepId){

function addChar(id){
  if(!CH[id])return false;

function rollUnit(skip,tier){
  const od=ODDS[Math.min(4,G.clears||0)];   // 清过的房间越多，高费干员越常见
  for(let tries=0;tries<14;tries++){
    const r=Math.random()*100,t=tier&&tries<6?tier:(r<od[0]?1:r<od[0]+od[1]?2:3);
    const pool=Object.keys(COST).filter(id=>COST[id]===t&&!skip.includes(id)&&!(owned(id)&&owned(id).copies>=9));
    if(pool.length)return pick(pool);
  }

}
/* 每次开箱 / 击败 BOSS 生成 4 个人选。新伙伴 4/6/8，已有的人再招一次 3/4/5，装备 5，布丁 2（合计通常 13~17）。
   收入：补给箱 5（无伤 +2）、精英 2、BOSS 10 —— 一个房间只够买其中一两样，必须取舍。 */
function rollShop(boss){
  const cards=[],ids=[],off=aug('lucky')?1:0;
  const unit=tier=>{const id=rollUnit(ids,tier);if(!id)return false;ids.push(id);const t=COST[id];cards.push({kind:'ch',id,cost:Math.max(1,(owned(id)?[0,3,4,5][t]:[0,4,6,8][t])-off)});return true;};
  const equip=()=>{const pool=Object.keys(EQ).filter(k=>!EQ[k].art&&!eq(k)&&!cards.some(x=>x.id===k));if(!pool.length)return false;cards.push({kind:'eq',id:pick(pool),cost:Math.max(1,5-off)});return true;};
  unit(boss?3:0);unit(0);
  if(!(Math.random()<0.55&&unit(0)))equip()||unit(0);
  if(Math.random()<0.6){equip()||cards.push({kind:'heal',cost:2});}else cards.push({kind:'heal',cost:2});
  while(cards.length<4)cards.push({kind:'heal',cost:2});
  G.shop=cards.slice(0,4);
}
function buy(i){
  const c=G.shop[i];if(!c||c.sold)return;
  if(G.coins<c.cost){tip('鲸币不够！去揍点小怪吧',1.5);return;}
  if(c.kind==='ch'){if(owned(c.id)&&owned(c.id).copies>=9){tip(CH[c.id].name+' 已经是★★★王牌了',1.5);return;}
    if(!addChar(c.id)){tip('队伍已满 4 人：右键卖掉一个队友再买',2);return;}}
  else if(c.kind==='heal')heal(40);
  else{
    const fuse=Object.keys(EQ).find(k=>EQ[k].art&&EQ[k].art.includes(c.id)&&EQ[k].art.some(p=>p!==c.id&&G.equips.includes(p)));
    if(fuse){const other=EQ[fuse].art.find(p=>p!==c.id);G.equips.splice(G.equips.indexOf(other),1,fuse);G.fuseT=2.5;G.fuseName=EQ[fuse].n;sfx('up');G.flash=0.3;}

/* ============ BOSS 设计规则（数值在这里统一推算） ============
 * 玩家：生命 120 起（每多 1 名队友 +15）。迷迷实测输出 ≈ 60 点/秒（重劈 20 + 震波 8，0.45 秒一次）。
 * 1) BOSS 没有接触伤害，只有带预警的招式会伤人（鞭与横扫 14 / 震波 10 / 弹幕 6）。
 * 2) 每一招 = 预警（≥0.55 秒，屏幕上写明躲法）→ 出招 → 喘息（1.0~1.8 秒，站桩不动）。
 * 3) 架势：BOSS 不在喘息 / 眩晕时只吃 40% 伤害（灰字）；喘息 / 眩晕时吃 150% 破绽暴击。
 *    → 乱砍 ≈ 24 点/秒，抓喘息 ≈ 90 点/秒：正确打法是「躲招 → 喘息时贴上去输出」。
 * 4) 破防条：实际伤害 ×0.25 累积，极限闪避 +25；满 100 → 眩晕 2.2 秒（约能打出 200 伤害）。
 * 5) 三阶段：生命 66% / 33% 处强制切换（伤害不会跨阶段溢出），切换时无敌、清屏、掉 2 块大烤肉（各回 15）。
 * 教官 1200 血：每阶段 400，一个喘息窗口 ≈ 110 伤害 → 每阶段约 3 个窗口 + 1 次破防，全程约 40~60 秒；
 *   玩家 120 血能吃 8 鞭，加上 4 块烤肉共 60 回复，容错约 12 次失误。
 *   实测（脚本模拟，单人迷迷）：躲招抓喘息 44~54 秒无伤或轻伤过关；贴脸乱砍 30 秒左右也能过，但要掉 40~50 血。
 * 管家 1700 血：此时队伍通常 3~4 人、有升星和装备，输出约为开局 1.5 倍，时长相近。
 */
const BRK_RATE=0.25;

function bossPhase(e){

  G.phaseFx={t:1.7,max:1.7,x:cx,y:cy,c:ph===2?'232,170,90':'255,80,90',title:ph===2?'第 二 阶 段':'最 终 阶 段',name:e.pn[ph-1]};G.hitstop=0.55;G.zoom=0.08;shake(20);sfx('boom');sfx('kill');

function whipReach(e,y0,y1){   // 鞭子会被掩体挡住：只要掩体在鞭子的高度上

function whipBox(e){

function updFx(dt){
  for(const f of fx){
    if(f.delay>0){f.delay-=dt;continue;}
    f.life-=dt;

    else if(f.k==='flame'||f.k==='dust'||f.k==='ember'){f.x+=f.vx*dt;f.y+=f.vy*dt;}
    else if(f.k==='corpse'){f.vy+=1700*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=dt*9*sgn(f.vx);}

    if(c.kind==='ch'){const d=CH[c.id],m=owned(c.id);

      let tx=r.x+14+g.measureText(d.name).width+14;if(d.wild)t2('百搭',tx,r.y+135,11,UI.dim);else d.syn.forEach(k=>{g.fillStyle=SYN[k].c;g.fillRect(tx,r.y+129,4,10);t2(SYN[k].name.slice(0,2),tx+8,r.y+135,11,UI.tx);tx+=46;});

  if(G.starT>0){const m=owned(G.starId);notice(250,CH[G.starId].name+' 升为 '+'★'.repeat(m?star(m):2)+' '+STARN[m?star(m):2],'攻击与范围全面强化');}

}

/* ============ 强化符文三选一 ============ */
const augRect=i=>({x:215+i*290,y:210,w:260,h:280});
function updAug(){
  if(stT<0.35)return;
  for(let i=0;i<G.augPick.length;i++)if(pr['Digit'+(i+1)]||(pr.M0&&inR(augRect(i)))){takeAug(G.augPick[i]);return;}
  if(pr.KeyR&&G.augRe>0){const next=G.augNext;openAug(next);G.augRe=0;}
}

  g.fillStyle='rgba(5,9,18,.86)';g.fillRect(0,0,W,H);

    t2(AUGT[a.t],cx,r.y+30,12,AUGC[a.t],'center',700);
    gem(cx,r.y+96,30+Math.sin(T*3+i)*2,AUGC[a.t]);t2(''+(i+1),cx,r.y+97,22,'#0d1524','center',900);
    t2(a.n,cx,r.y+166,24,UI.tx,'center',900);
    a.d.split('，').forEach((w,j)=>t2(w,cx,r.y+204+j*22,14,UI.dim,'center'));
    g.restore();});
  t2(G.augRe>0?'按 1 / 2 / 3 或点击选择 · R 免费重抽一次':'按 1 / 2 / 3 或点击选择',640,540,14,UI.tx,'center');
}

  }

  g.save();g.translate(250,150);g.rotate(Math.sin(T*2)*0.15);ell(0,0,36,36,'#3a3340',INK,5);rr(-9,-48,18,16,3,'#888',INK,4);ell(-12,-12,8,6,'#fff6');
  burst(8,-66,22+Math.sin(T*20)*5,9,7,T*4);g.fillStyle='#ffd54f';g.fill();g.strokeStyle=INK;g.lineWidth=3;g.stroke();g.restore();
  burst(1040,140,40+Math.sin(T*6)*6,16,8,T);g.fillStyle='#ff7043';g.fill();g.strokeStyle=INK;g.lineWidth=4;g.stroke();
  drawDessert(0,1090,330,1.8);drawDessert(1,180,350,1.7);drawDessert(2,990,420,1.3);
  txt('云鲸号甜品偷吃大作战！',640,382,34,'#fff',INK,8);
  chibi(330,640,2.6,CH.mimi,1,T,{walk:1,open:1});drawHammer(250,470+Math.sin(T*4)*8,1.6,0.3);
  chibi(930,650,1.5,CH.bobo,-1,T+1,{bean:1});chibi(1010,650,1.5,CH.aken,-1,T+2,{bean:1});chibi(1090,650,1.5,CH.lala,-1,T+3,{bean:1});
  const bs=1+Math.sin(T*5)*0.04;g.save();g.translate(640,480);g.scale(bs,bs);rr(-190,-38,380,76,22,'#ff5252',INK,6);txt('点击开始偷吃',0,2,38,'#fff',INK,7);g.restore();
  rr(390,548,500,128,14,'#fffbe9ee',INK,4);
  txt('WASD/方向键 移动跳跃   J/左键 攻击   K/Shift 闪避',640,572,16,INK);
  txt('空中 S+J 角色专属向下攻击   L/右键 大招   E 交互',640,598,16,INK);

/* ============ 主循环 ============ */
let last=0,stT=0;
function frame(ts){
  if(!GAME_READY){last=ts;for(const k in pr)delete pr[k];requestAnimationFrame(frame);return;}
  const dt=clamp((ts-last)/1000||0,0,0.033);last=ts;T+=dt;stT+=dt;musicTick(dt);
  if(state==='title'){drawTitle();if(pr.M0||pr.Enter||pr.Space||pr.KeyJ){newGame();state='play';stT=0;mouse.l=false;sfx('up');}}
  else if(state==='play'){
    for(const k of ['shake'])if(G[k]>0)G[k]=Math.max(0,G[k]-dt*40);
    G.zoom=(G.zoom||0)*Math.pow(0.003,dt);G.kx=(G.kx||0)*Math.pow(0.0005,dt);if(G.hurtFx>0)G.hurtFx-=dt;if(G.phaseFx){G.phaseFx.t-=dt;if(G.phaseFx.t<=0)G.phaseFx=null;}
    for(const k of ['flash','unityBanner','joinT','fuseT','starT'])if(G[k]>0)G[k]-=dt;
    if(G.tip.t>0)G.tip.t-=dt;if(G.banner.t>0)G.banner.t-=dt;
    // 头像点击切换
    if(pr.M0){for(let i=0;i<G.team.length;i++)if(mouse.x>16+i*62&&mouse.x<70+i*62&&mouse.y>96&&mouse.y<150){switchTo(i);mouse.l=false;}}
    for(let i=0;i<4;i++)if(pr['Digit'+(i+1)])switchTo(i);
    if(pr.KeyM){WORLD.mapOpen=!WORLD.mapOpen;sfx('ui');}
    if(WORLD.mapOpen){}
    else if(K.pPanel()){state='shop';sfx('ui');}
    else if(G.hitstop>0)G.hitstop-=dt;
    else{const slow=G.slowmo>0;if(slow)G.slowmo-=dt;step(dt*(slow?0.3:1),dt*(slow?0.85:1));updFx(dt*(slow?0.5:1));}
    drawScene();drawHUD();
    if(WORLD.mapOpen)WORLD.drawMap(g,true);
  }else if(state==='shop'){
    if(G.tip.t>0)G.tip.t-=dt;for(const k of ['flash','fuseT','unityBanner','starT'])if(G[k]>0)G[k]-=dt;
    updShop();drawScene();drawHUD();drawShop();
    if(G.fuseT>0){rr(390,400,500,60,14,'#ffd54f',INK,5);txt('赌狗合成！！《'+G.fuseName+'》',640,431,24,INK);}
  }else if(state==='aug'){
    if(G.flash>0)G.flash-=dt;updAug();drawScene();drawHUD();if(state==='aug')drawAug();
  }else if(state==='lose'){
    G.loseT+=dt;drawScene();drawLose();if(G.loseT>0.6&&K.pOk()){respawn();mouse.l=false;}
  }else if(state==='win'){
    drawWin();if(stT>0.5&&K.pOk()){state='title';mouse.l=false;}
  }
  if(state!=='win')stT=state==='play'?0:stT;
  for(const k in pr)delete pr[k];
  requestAnimationFrame(frame);
}
if(new URLSearchParams(location.search).has('room')){newGame();state='play';}
requestAnimationFrame(frame);
